name: Checks

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Check portable paths
        run: npm run check:paths

      - name: Build
        run: npm run build

      - name: Check links, hreflang and budgets
        run: npm run check:site
